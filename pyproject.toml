[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miratrade"
version = "0.1.0"
description = "Swing-trade edge research: insider buying + unusual options flow + price-action setups, backtested."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31"]

[project.optional-dependencies]
yf = ["yfinance>=0.2.40"]
schwab = ["schwab-py>=1.5", "keyring>=25"]
etrade = ["requests-oauthlib>=2.0", "keyring>=25"]
app = ["PySide6>=6.7"]
# The API and the web page. A separate extra because the desktop app must never need a server, and
# the server must never need Qt — see docs/ESTRUCTURA.md.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "joserfc>=1.0", "httpx>=0.27"]
# Congressional disclosures are PERSONAL USE ONLY (Ethics in Government Act, 5 U.S.C. app. § 105(c)):
# they are an extra, not a dependency, because this is the one part that must come out before
# MiraTrade is sold to anyone. See docs/DATA.md.
congress = ["pdfplumber>=0.11"]
# FinBERT over the prose of an 8-K. ONNX rather than torch: ~250 MB against ~2.5 GB for a
# 110M-parameter classifier that runs on a CPU in milliseconds. Off by default in settings —
# no news signal here has survived an out-of-sample test. See miratrade/news/sentiment.py.
news = ["optimum[onnxruntime]>=1.20", "transformers>=4.40"]
dev = ["pytest>=7", "pytest-qt>=4", "pdfplumber>=0.11"]

[project.scripts]
miratrade = "miratrade.cli:main"

[project.gui-scripts]
miratrade-app = "miratrade.app.main:run"

[tool.setuptools.packages.find]
include = ["miratrade*"]

[tool.setuptools.package-data]
"miratrade.app" = ["assets/*.svg", "assets/*.ico", "assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
