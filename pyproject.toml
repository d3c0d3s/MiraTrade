[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirabot"
version = "0.1.0"
description = "Swing-trade edge research: insider buying + unusual options flow + price-action setups, backtested."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31"]

[project.optional-dependencies]
yf = ["yfinance>=0.2.40"]
dev = ["pytest>=7"]

[project.scripts]
mirabot = "mirabot.cli:main"

[tool.setuptools.packages.find]
include = ["mirabot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
