[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miratrade"
version = "0.1.0"
description = "Swing-trade edge research: insider buying + unusual options flow + price-action setups, backtested."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31"]

[project.optional-dependencies]
yf = ["yfinance>=0.2.40"]
schwab = ["schwab-py>=1.5", "keyring>=25"]
app = ["PySide6>=6.7"]
dev = ["pytest>=7", "pytest-qt>=4"]

[project.scripts]
miratrade = "miratrade.cli:main"

[project.gui-scripts]
miratrade-app = "miratrade.app.main:run"

[tool.setuptools.packages.find]
include = ["miratrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
