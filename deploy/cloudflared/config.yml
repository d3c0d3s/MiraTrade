# Túnel de Cloudflare para la web de MiraTrade.
#
# La API no autentica: escucha en 127.0.0.1 y este túnel es lo único que la saca fuera. Delante
# va **Cloudflare Access** con una política de correo, que es quien decide quién entra. Publicar
# el túnel sin esa política deja la base de datos abierta a internet.
#
# Sustituye <TUNNEL-UUID> y el dominio. El fichero de credenciales lo genera `cloudflared tunnel
# create` y NO va al repositorio.
tunnel: <TUNNEL-UUID>
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: miratrade.miratechcloud.com
    service: http://127.0.0.1:8787
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
  # Todo lo demás se rechaza. Sin esta regla final cloudflared no arranca, y sin ella un hostname
  # mal escrito acabaría sirviendo algo que nadie quería servir.
  - service: http_status:404
